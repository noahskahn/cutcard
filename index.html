<!doctype html>
<html lang="en">
<head>

<title>Cutcard — Blackjack Advantage-Play Analytics</title>
<meta name="description" content="Blackjack card counting calculator: custom rules, bet spreads, EV, risk of ruin and Monte Carlo bankroll simulations.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">

<header class="top">
